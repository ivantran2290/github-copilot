<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculate Age</title>
    <link rel="stylesheet" href="styles.css">
    <script src="common.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        .form-section {
            width: 100%;
            max-width: 600px;
            margin-bottom: 20px;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        label, input, button {
            margin-bottom: 10px;
        }
        button {
            align-self: flex-start;
        }
        @media (min-width: 768px) {
            .form-section {
                flex-direction: row;
                justify-content: space-between;
            }
            form {
                flex-direction: row;
                align-items: center;
            }
            label, input, button {
                margin-bottom: 0;
                margin-right: 10px;
            }
            button {
                align-self: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <section class="form-section">
            <form id="ageForm">
                <label for="birthYear">Enter your birth year:</label>
                <input type="number" id="birthYear" name="birthYear" required>
                <button type="submit">Calculate Age</button>
            </form>
            <p id="result"></p>
        </section>
        <section class="form-section">
            <form id="exchangeForm">
                <label for="currencyFrom">From:</label>
                <input type="text" id="currencyFrom" name="currencyFrom" required>
                <label for="currencyTo">To:</label>
                <input type="text" id="currencyTo" name="currencyTo" required>
                <button type="submit">Get Exchange Rate</button>
                <button type="button" id="swapCurrencies">Swap</button>
            </form>
            <p id="exchangeResult"></p>
        </section>
        <section class="form-section">
            <form id="githubForm">
                <label for="username">Enter GitHub Username:</label>
                <input type="text" id="username" name="username" required>
                <button type="submit">Get Repositories</button>
            </form>
            <ul id="repoList"></ul>
        </section>
        <section class="form-section">
            <form id="dateForm">
                <label for="dateInput">Select a date:</label>
                <input type="date" id="dateInput" name="dateInput" required>
                <button type="submit">Submit Date</button>
            </form>
            <p id="dateResult"></p>
        </section>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const newsLinks = getTopNewsLinks();
            const newsList = document.getElementById('newsLinks');
            newsLinks.forEach(link => {
                const listItem = document.createElement('li');
                const anchor = document.createElement('a');
                anchor.href = link.url;
                anchor.textContent = link.title;
                listItem.appendChild(anchor);
                newsList.appendChild(listItem);
            });
        });

        document.getElementById('ageForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const birthYear = document.getElementById('birthYear').value;
            const age = calculateAge(birthYear);
            document.getElementById('result').innerText = `Your age is: ${age}`;
        });

        document.getElementById('swapCurrencies').addEventListener('click', function() {
            const currencyFromInput = document.getElementById('currencyFrom');
            const currencyToInput = document.getElementById('currencyTo');
            const temp = currencyFromInput.value;
            currencyFromInput.value = currencyToInput.value;
            currencyToInput.value = temp;
        });

        document.getElementById('exchangeForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            const currencyFrom = document.getElementById('currencyFrom').value;
            const currencyTo = document.getElementById('currencyTo').value;
            const exchangeRate = await getExchangeRate(currencyFrom, currencyTo);
            document.getElementById('exchangeResult').innerText = `Exchange rate from ${currencyFrom} to ${currencyTo} is: ${exchangeRate}`;
        });

        document.getElementById('githubForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            const repositories = await getUserRepositories(username);
            const repoList = document.getElementById('repoList');
            repoList.innerHTML = '';
            repositories.forEach(repo => {
                const listItem = document.createElement('li');
                const anchor = document.createElement('a');
                anchor.href = repo.html_url;
                anchor.textContent = repo.name;
                listItem.appendChild(anchor);
                repoList.appendChild(listItem);
            });
        });

        document.getElementById('dateForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const selectedDate = document.getElementById('dateInput').value;
            document.getElementById('dateResult').innerText = `You selected: ${selectedDate}`;
        });
    </script>
   </body>
<script>
    document.addEventListener('DOMContentLoaded', async function() {
        const countryList = await getCountryList();
        const selectBox = document.createElement('select');
        selectBox.id = 'countrySelect';
        countryList.forEach(country => {
            const option = document.createElement('option');
            option.value = country.code;
            option.textContent = country.name;
            selectBox.appendChild(option);
        });
        document.querySelector('.container').appendChild(selectBox);
    });
</script>
</html>
